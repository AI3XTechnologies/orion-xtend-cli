name: release-please

on:
  push:
    branches: [main]
  # Re-runnable without an empty commit. release-please aborts on conditions that
  # are cleared outside git — an untagged merged release PR, a stale label — and
  # without this the only way to retry was to push something.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write     # keyless cosign signing of the oxtend image

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT, not GITHUB_TOKEN. This org forbids GitHub Actions from creating
          # pull requests, and release-please's whole loop depends on opening its own
          # PR and then parsing the body it generated to decide what to release. With
          # GITHUB_TOKEN it updated the release branch and then died on PR creation,
          # and a hand-made PR merged without releasing anything — the run rejects it
          # with "Pull request body did not match". A PAT is not subject to that
          # restriction, so the PR is created as a user and the loop closes.
          # Falls back to GITHUB_TOKEN so a fork without the secret still runs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          pip install build
          python -m build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push oxtend:<version>
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ai3xtechnologies/oxtend:${{ needs.release-please.outputs.version }}
            ghcr.io/ai3xtechnologies/oxtend:latest

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image we just published
        # The tool that refuses to push unsigned bundles must not itself ship
        # unsigned.
        run: |
          cosign sign --yes \
            ghcr.io/ai3xtechnologies/oxtend:${{ needs.release-please.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: oxtend-wheel-${{ needs.release-please.outputs.version }}
          path: dist/*

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write     # keyless cosign signing of the oxtend image

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          pip install build
          python -m build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push oxtend:<version>
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ai3xtechnologies/oxtend:${{ needs.release-please.outputs.version }}
            ghcr.io/ai3xtechnologies/oxtend:latest

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image we just published
        # The tool that refuses to push unsigned bundles must not itself ship
        # unsigned.
        run: |
          cosign sign --yes \
            ghcr.io/ai3xtechnologies/oxtend:${{ needs.release-please.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: oxtend-wheel-${{ needs.release-please.outputs.version }}
          path: dist/*

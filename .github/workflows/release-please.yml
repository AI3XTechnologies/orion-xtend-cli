name: release-please

on:
  push:
    branches: [main]
  # Re-runnable without an empty commit. release-please aborts on conditions that
  # are cleared outside git — an untagged merged release PR, a stale label — and
  # without this the only way to retry was to push something.
  workflow_dispatch:
    inputs:
      publish_version:
        # Recovery path. The publish job is gated on release-please reporting a
        # release, so if a tag ends up created any other way the artefacts for it
        # can never be built — the wheel, the image and its signature would simply
        # not exist for a version the registry is expected to serve. Passing a
        # version here builds and publishes that tag's artefacts directly.
        description: "Build and publish artefacts for an existing tag (e.g. 0.1.0). Leave empty for a normal run."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write     # keyless cosign signing of the oxtend image

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT, not GITHUB_TOKEN. This org forbids GitHub Actions from creating
          # pull requests, and release-please's whole loop depends on opening its own
          # PR and then parsing the body it generated to decide what to release. With
          # GITHUB_TOKEN it updated the release branch and then died on PR creation,
          # and a hand-made PR merged without releasing anything — the run rejects it
          # with "Pull request body did not match". A PAT is not subject to that
          # restriction, so the PR is created as a user and the loop closes.
          # Falls back to GITHUB_TOKEN so a fork without the secret still runs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || inputs.publish_version != ''
    runs-on: ubuntu-latest
    env:
      # One source of truth for the version, so the wheel, the image tag and the
      # signature cannot disagree about which release they belong to.
      VERSION: ${{ needs.release-please.outputs.version || inputs.publish_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On the recovery path check out the tag, not the branch: main may have
          # moved on, and the artefacts must be built from what the tag names.
          ref: ${{ inputs.publish_version != '' && format('v{0}', inputs.publish_version) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          pip install build
          python -m build

      # The image cannot resolve orion-backend from any index — it is private and
      # published nowhere. Core is checked out and wheeled into the build context so
      # the Dockerfile has something to install. Same shape orion-client-dilmah's CI
      # already uses; without it the image build fails on dependency resolution.
      - name: Check out core (for the vendored kernel modules)
        uses: actions/checkout@v4
        with:
          repository: AI3XTechnologies/orion-knowledge-hive
          ref: v2
          path: .core
          token: ${{ secrets.CORE_READ_TOKEN }}
          fetch-depth: 1

      - name: Wheel core into the image build context
        run: pip wheel --no-deps --wheel-dir core-dist ./.core/backend

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push oxtend:<version>
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ai3xtechnologies/oxtend:${{ env.VERSION }}
            ghcr.io/ai3xtechnologies/oxtend:latest

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image we just published
        # The tool that refuses to push unsigned bundles must not itself ship
        # unsigned.
        run: |
          cosign sign --yes \
            ghcr.io/ai3xtechnologies/oxtend:${{ env.VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: oxtend-wheel-${{ env.VERSION }}
          path: dist/*
